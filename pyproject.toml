[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-suite"
version = "0.1.0"
description = "Offline AI evaluation workbench engine for local LLM benchmarking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OG Maven T&E" }]
keywords = ["llm", "evaluation", "benchmark", "offline", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "playwright>=1.40",
]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.24",
]
hf = [
    "torch",
    "transformers",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"
llm-eval-api = "apps.api.main:run_server"
llm-eval-dioptra = "llm_eval.dioptra.cli:main"
llm-eval-rampart = "llm_eval.rampart.cli:main"
llm-eval-garak = "llm_eval.garak.cli:main"
llm-eval-suite = "llm_eval_suite.app:main"

[project.urls]
Homepage = "https://github.com/OGMavenTandE/llm-eval-suite"
Repository = "https://github.com/OGMavenTandE/llm-eval-suite"
Issues = "https://github.com/OGMavenTandE/llm-eval-suite/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_eval*", "apps*", "llm_eval_suite*"]

[tool.setuptools.package-data]
llm_eval_suite = ["static/*", "static/fonts/*", "static/favicon.ico", "presets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
